<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graveyard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Infant:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #050505;
      color: #d4cfc7;
      font-family: 'Cormorant Infant', serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(80, 0, 0, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(40, 0, 60, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 50% 30%, rgba(20, 0, 0, 0.25) 0%, transparent 70%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 7vw, 4rem);
      letter-spacing: 0.15em;
      color: #e8e2da;
      text-shadow:
        0 0 10px rgba(180, 30, 30, 0.45),
        0 0 30px rgba(120, 0, 0, 0.25),
        0 2px 0 #1a0505;
      margin-bottom: 32px;
    }

    .tagline {
      font-family: 'Cormorant Infant', serif;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      letter-spacing: 0.08em;
      color: #9a9086;
      text-shadow: 0 0 8px rgba(140, 120, 100, 0.15);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .image-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      border: 2px solid rgba(150, 130, 110, 0.25);
      border-radius: 8px;
      padding: 6px;
      background: linear-gradient(180deg, rgba(20,10,10,0.6) 0%, rgba(8,4,4,0.8) 100%);
      box-shadow:
        0 0 30px rgba(80, 0, 0, 0.25),
        0 0 80px rgba(40, 0, 0, 0.12),
        inset 0 0 40px rgba(0,0,0,0.7);
      margin-bottom: 36px;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      filter: contrast(1.05) brightness(0.92) saturate(0.85);
    }

    .image-wrap::before {
      content: '';
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(150, 130, 110, 0.08);
      border-radius: 12px;
      pointer-events: none;
    }

    .links {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 28px;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #cbbfae;
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.06em;
      padding: 10px 22px;
      border: 1px solid rgba(150, 130, 110, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
      text-shadow: 0 0 8px rgba(180, 30, 30, 0.15);
    }

    .link:hover {
      color: #fff;
      background: rgba(120, 20, 20, 0.15);
      border-color: rgba(180, 60, 60, 0.4);
      box-shadow: 0 0 20px rgba(140, 20, 20, 0.25);
      transform: translateY(-2px);
    }

    .link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      opacity: 0.85;
    }

    .subtext {
      font-family: 'Cormorant Infant', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      letter-spacing: 0.12em;
      color: #a0988c;
      text-shadow: 0 0 12px rgba(140, 120, 100, 0.2);
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(150,130,110,0.35), transparent);
      margin: 18px auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container > * {
      animation: fadeIn 1.2s ease both;
    }
    .container > *:nth-child(1) { animation-delay: 0.1s; }
    .container > *:nth-child(2) { animation-delay: 0.35s; }
    .container > *:nth-child(3) { animation-delay: 0.6s; }
    .container > *:nth-child(4) { animation-delay: 0.85s; }
    .container > *:nth-child(5) { animation-delay: 1.1s; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Graveyard</h1>

    <p class="tagline">Most memecoins have a picture. GRAVEYARD has a story.</p>

    <div class="image-wrap">
      <img src="assets/main.jpeg" alt="Graveyard" />
    </div>

    <div class="links">

        Telegram

    </div>

    <div class="divider"></div>

    <p class="subtext">Stay tuned for updates</p>
  </div>
</body>
</html>
